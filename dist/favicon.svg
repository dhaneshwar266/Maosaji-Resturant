<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70283A" />
      <stop offset="100%" stop-color="#401923" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="50%" stop-color="#E4AD52" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="#E4AD52" stroke-width="0.75" stroke-dasharray="2 2" />
  
  <!-- Royal Kalash / Diya Flame Indian Motif -->
  <path d="M50 18 C56 28 62 36 50 48 C38 36 44 28 50 18 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="34" r="3" fill="#FFF8ED" />
  
  <!-- Traditional Arch Base -->
  <path d="M26 68 Q50 56 74 68 L70 78 Q50 72 30 78 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="62" r="3.5" fill="#401923" />
  
  <!-- Royal M Monogram -->
  <text x="50" y="62" font-family="'Cinzel', Georgia, serif" font-size="19" font-weight="bold" fill="#FFF8ED" text-anchor="middle" dominant-baseline="middle">M</text>
</svg>